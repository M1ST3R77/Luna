name: Push CI/CD

permissions:
  contents: write

on:
  push:
    branches-ignore:
      - 'ga-ignore-**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-tests-linux:
    name: Build-Tests-Linux
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    container:
      image: ubuntu:latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y docker.io
      - name: Create executable directory
        run: mkdir -p executable
      - name: Run pymake build
        run: ./pymake -d
        timeout-minutes: 15
      - name: Run tests
        run: ./pymake tests -d
        timeout-minutes: 10
      - name: Upload Linux executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna_linux
          path: ./executable/luna_linux
  
  build-tests-windows:
    name: Build-Tests-Windows
    runs-on: windows-latest
    needs: build-tests-linux
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pymake build
        run: python .\pymake -d
        timeout-minutes: 10
      - name: Run tests
        run: python .\pymake tests -d
        timeout-minutes: 10
      - name: Show the executable output when tests fail
        if: failure()
        shell: pwsh
        run: |
          & .\executable\luna_windows.exe .\tests\test_files\bonjour.test -d 2>&1 | Out-String -Width 200
          Write-Output "Exit code: $LASTEXITCODE"
      - name: Upload Windows executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna_windows
          path: .\executable\luna_windows.exe

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-tests-linux, build-tests-windows]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Determine next tag
        id: tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          MAJOR=$(echo $LAST_TAG | cut -d. -f1 | tr -d 'v')

          MAJOR=$((MAJOR + 1))
          NEW_TAG="v${MAJOR}"

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git tag $NEW_TAG
          git push origin $NEW_TAG
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: luna_linux
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: luna_windows
      - name: Publish a release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            luna_linux
            luna_windows.exe
          tag_name: ${{ env.NEW_TAG }}
          body: This is an automated release for version ${{ env.NEW_TAG }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  delete-artifacts:
    name: Delete Artifacts
    runs-on: ubuntu-latest
    needs: [build-tests-linux, build-tests-windows, create-release]
    if: always()
    steps:
      - name: Delete Linux artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: luna_linux

      - name: Delete Windows artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: luna_windows